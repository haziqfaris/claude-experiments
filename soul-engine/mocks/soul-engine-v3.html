<title>Soul Engine v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one top bar (soul switcher, three places, metrics, lock), then one working area per place.
   The app's own dark navy, made friendlier: rounded tonal cards, pill chips, soft state layers. Emerald is the default accent. */
:root {
  --bg: #050a14; --bg-2: #020408;
  --surface: #0e1626; --surface-2: #142035; --surface-3: #1b2943; --outline: rgba(148, 178, 255, 0.10); --outline-2: rgba(148, 178, 255, 0.2);
  --accent: #34d399; --accent-ink: #022c1e; --accent-soft: rgba(52, 211, 153, 0.14);
  --text: #e8edf5; --muted: #9aa6ba; --dim: #66728a;
  --work: #34d399; --wait: #fbbf24; --wait-ink: #2b1d00; --done: #5eead4; --red: #f87171; --violet: #b39dff; --amber: #fbbf24; --teal: #5eead4;
  --gold: var(--wait); --cyan: var(--work); --brand: var(--accent);
  --sans: "Poppins", "Segoe UI", system-ui, sans-serif;
  --code: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-card: 20px; --r-tile: 14px; --r-pill: 999px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg-2); color: var(--text); font: 400 13px/1.55 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { min-height: 100%; background: radial-gradient(circle at 50% 50%, rgba(52, 211, 153, 0.05) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(var(--bg-2), var(--bg) 40%, var(--bg-2)); }

/* Top bar */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; min-height: 64px; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(5, 10, 20, 0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--outline); }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 12px; }
.brand::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #d1fae5, var(--accent) 45%, rgba(52, 211, 153, 0) 72%); box-shadow: 0 0 12px rgba(52, 211, 153, 0.6); }
.brand b { font-weight: 600; font-size: 18px; letter-spacing: 0.04em; }
.brand span { font-size: 11px; color: var(--muted); }
.switch { position: relative; }
.switch > button { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border-radius: var(--r-pill); background: var(--surface-2); max-width: 240px; font-weight: 500; transition: background 0.15s; }
.switch > button:hover { background: var(--surface-3); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.menu { position: absolute; left: 0; top: 46px; width: 280px; background: var(--surface-2); border-radius: 16px; padding: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; text-align: left; }
.menu button:hover { background: rgba(255, 255, 255, 0.06); }
.menu .k { padding: 10px 12px 4px; font-size: 11px; font-weight: 500; color: var(--dim); }
.tabs { display: flex; gap: 4px; margin-left: 6px; padding: 4px; border-radius: var(--r-pill); background: var(--surface); }
.tab { height: 34px; padding: 0 16px; border-radius: var(--r-pill); font-size: 13px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 7px; transition: background 0.15s, color 0.15s; }
.tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.tab[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
.badge { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: var(--r-pill); background: var(--wait); color: var(--wait-ink); line-height: 18px; }
.metrics { margin-left: auto; display: flex; gap: 22px; }
.metric { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; }
.metric small { font-size: 11px; color: var(--dim); }
.metric b { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.lockbtn { height: 38px; padding: 0 18px; border-radius: var(--r-pill); background: var(--surface-2); font-weight: 500; color: var(--text); transition: background 0.15s; }
.lockbtn:hover { background: var(--surface-3); }
.mockchip { font-size: 11px; color: var(--wait); background: rgba(251, 191, 36, 0.1); border-radius: var(--r-pill); padding: 2px 10px; }

/* Working area */
main { padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.head .s { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.label { font-size: 12px; font-weight: 500; color: var(--muted); }
.code { font-family: var(--code); font-size: 11.5px; }

/* Cards: rounded, tonal, softly lifted */
.glass { position: relative; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-card); box-shadow: var(--shadow); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none;
  color: var(--hue); background: color-mix(in srgb, var(--hue) 18%, transparent); }

.pill { font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: var(--r-pill); white-space: nowrap; }
.p-work { color: var(--work); background: var(--accent-soft); }
.p-wait { color: var(--wait-ink); background: var(--wait); }
.p-idle { color: var(--muted); background: var(--surface-3); }
.p-done { color: var(--done); background: rgba(94, 234, 212, 0.12); }
.bar { height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: var(--r-pill); }
.track { display: flex; gap: 3px; }
.track span { height: 6px; flex: 1; border-radius: var(--r-pill); background: var(--surface-3); }

/* Projects: a rounded card per project; its chats sit inside as softer tiles */
.project { margin-bottom: 14px; }
.project-top { display: grid; grid-template-columns: 22px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr); gap: 18px; align-items: center; padding: 16px 20px; cursor: pointer; border-radius: var(--r-card); transition: background 0.15s; }
.project-top:hover { background: rgba(255, 255, 255, 0.025); }
.chev { color: var(--dim); transition: transform 0.2s; font-size: 12px; text-align: center; }
.open .chev { transform: rotate(90deg); color: var(--text); }
.pname { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.pname a { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: var(--r-pill); padding: 1px 10px; text-decoration: none; }
.pname a:hover { background: rgba(52, 211, 153, 0.24); }
.chats { display: grid; gap: 8px; padding: 0 14px 14px; }
.chat { display: grid; grid-template-columns: 22px minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1.7fr) 130px; gap: 18px; align-items: center; padding: 12px 16px; background: var(--surface-2); border-radius: var(--r-tile); cursor: pointer; transition: background 0.15s; }
.chat:hover { background: var(--surface-3); }
.cname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.said { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ask { color: var(--wait); }
.right { text-align: right; }
.sectionhead { display: grid; grid-template-columns: 22px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr); gap: 18px; padding: 0 21px 8px; }

/* Chats board */
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.col h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.col h2 .count { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); border-radius: var(--r-pill); padding: 0 9px; }
.card { padding: 16px 18px 14px; margin-bottom: 12px; cursor: pointer; transition: transform 0.15s, background 0.15s, box-shadow 0.15s; }
.card:hover { background: var(--surface-2); transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35); }
.card .foot { display: flex; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--outline); font-size: 11px; color: var(--dim); }

/* Chat detail */
.back { font-size: 13px; font-weight: 500; color: var(--accent); padding: 6px 12px; margin: 0 0 12px -12px; border-radius: var(--r-pill); }
.back:hover { background: var(--accent-soft); }
.detail-top { padding: 20px 22px; margin-bottom: 16px; }
.detail-top h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.step { font-size: 12px; padding: 5px 12px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--muted); }
.step.done { color: var(--done); background: rgba(94, 234, 212, 0.1); }
.step.now { color: var(--accent-ink); background: var(--accent); font-weight: 500; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
.box { padding: 16px 18px; }
.tl { list-style: none; margin: 10px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; padding: 7px 0; font-size: 12px; border-top: 1px solid var(--outline); }
.tl li:first-child { border-top: 0; }
.lane { background: var(--surface-2); border-radius: var(--r-tile); padding: 10px 12px; margin-top: 8px; border: 0 !important; }
.copy { font-size: 12px; font-weight: 500; color: var(--accent-ink); background: var(--accent); border-radius: var(--r-pill); padding: 5px 14px; }
.copy:hover { filter: brightness(1.08); }

/* Project page */
.ptabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.ptab { padding: 7px 16px; border-radius: var(--r-pill); font-weight: 500; color: var(--muted); background: var(--surface); }
.ptab:hover { color: var(--text); }
.ptab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
.horizons { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.horizon { width: 270px; flex: none; padding: 16px; }
.item { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 12px 16px; }
td { padding: 11px 16px; border-top: 1px solid var(--outline); }
.scroll { overflow-x: auto; }

/* Soul and lock */
.soulwrap { position: relative; height: min(66vh, 620px); display: grid; place-items: center; }
.soulwrap canvas { width: min(540px, 90vw); height: min(540px, 90vw); }
.askbox { max-width: 660px; margin: 0 auto; padding: 16px 18px; }
.askbox input { width: 100%; margin-top: 8px; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-pill); padding: 13px 20px; color: var(--text); font: inherit; }
.askbox input:focus { outline: none; border-color: var(--accent); }
.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg-2); display: grid; place-items: center; cursor: pointer; }
.lock canvas { width: min(640px, 92vw); height: min(640px, 92vw); }
.murmur { position: absolute; left: 50%; top: 76%; transform: translateX(-50%); font-size: 15px; font-weight: 300; letter-spacing: 0.2em; color: rgba(52, 211, 153, 0.85); text-shadow: 0 0 12px rgba(52, 211, 153, 0.45); transition: opacity 1.4s; white-space: nowrap; }
.lock .hint { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #344055; }

@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.8s ease-in-out infinite; } @keyframes pulse { 50% { opacity: 0.55; } } }
@media (prefers-reduced-motion: reduce) { .card, .chat, .chev, .tab, .project-top { transition: none; } .card:hover { transform: none; } }
@media (max-width: 900px) {
  .metrics { display: none; }
  .project-top { grid-template-columns: 22px minmax(0, 1fr); }
  .project-top > :nth-child(n+3) { grid-column: 2; }
  .sectionhead { display: none; }
  .chat { grid-template-columns: 22px minmax(0, 1fr); }
  .chat > :nth-child(n+3) { grid-column: 2; }
  .chat .right { text-align: left; }
  .cols, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .tab { padding: 0 12px; }
}

/* Shared small controls */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ghost { font-size: 12px; font-weight: 500; color: var(--accent); padding: 4px 12px; border-radius: var(--r-pill); }
.ghost:hover { background: var(--accent-soft); }
.copy.sm { font-size: 11px; padding: 4px 12px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--r-pill); background: var(--surface); color: var(--muted); border: 1px solid var(--outline); }
.fchip span { color: var(--dim); font-weight: 400; }
.fchip:hover { color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: rgba(52, 211, 153, 0.35); }
.fchip[aria-pressed="true"] span { color: var(--accent); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-pill); background: var(--surface); }
.seg button { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: var(--r-pill); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.avatar.sm { width: 22px; height: 22px; font-size: 11px; }
.empty { padding: 22px; color: var(--muted); }

/* Inventory */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile.warn b { color: var(--wait); }
.invbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 44px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; outline: none; }
.invgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.invgrid aside { display: grid; gap: 12px; }
.invcard { padding: 14px 16px 10px; margin-bottom: 12px; }
.invhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.repo-sub { margin: 8px 0 2px 4px; font-family: var(--code); }
.fact { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, auto) 84px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; }
.fact:hover { background: var(--surface-2); }
.fact-label { font-weight: 500; font-size: 12.5px; word-break: break-word; }
.fact-ev { font-size: 11px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.c-service { background: #93c5fd; } .c-apikey { background: #fbbf24; } .c-api { background: #f0abfc; } .c-hosting { background: #34d399; } .c-domain { background: #5eead4; }
.c-email { background: #fca5a5; } .c-signin { background: #c4b5fd; } .c-job { background: #a3a3a3; } .c-default { background: #66728a; }
.side-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--outline); }
.side-row:first-of-type { border-top: 0; }
.plus { color: var(--done); font-weight: 600; width: 12px; } .minus { color: var(--red); font-weight: 600; width: 12px; }
.doc { display: block; width: 100%; text-align: left; font-size: 12.5px; font-weight: 500; padding: 9px 12px; margin-top: 6px; border-radius: 12px; background: var(--surface-2); }
.doc:hover { background: var(--surface-3); }

/* Tasks */
.suggest { display: flex; gap: 12px; align-items: center; padding: 12px 16px; margin-bottom: 14px; border-color: rgba(52, 211, 153, 0.3); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: rgba(14, 22, 38, 0.55); border-radius: var(--r-card); padding: 12px; }
.kcol h2 { margin: 2px 4px 12px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kcol h2 .count { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); border-radius: var(--r-pill); padding: 0 9px; }
.task { padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 6px; border-radius: 16px; transition: transform 0.15s; }
.task:hover { transform: translateY(-1px); }
.task-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.task-title { font-weight: 500; font-size: 13px; }
.task-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--outline); }
.srcpill { margin-left: auto; font-size: 10.5px; font-weight: 500; padding: 1px 8px; border-radius: var(--r-pill); background: var(--surface-3); color: var(--muted); }
.s-soul { background: var(--accent-soft); color: var(--accent); }
.s-split { background: rgba(147, 197, 253, 0.14); color: #93c5fd; margin-left: 0; }
.model { font-size: 11px; font-weight: 600; text-transform: capitalize; padding: 1px 8px; border-radius: var(--r-pill); color: var(--m); background: color-mix(in srgb, var(--m) 16%, transparent); }
@media (max-width: 1100px) { .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .invgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .kanban, .tiles { grid-template-columns: minmax(0, 1fr); } .fact { grid-template-columns: 10px minmax(0, 1fr); } .fact > :nth-child(n+3) { grid-column: 2; } }

/* Live topology */
.livetopo { padding: 14px 16px; margin-bottom: 18px; }
.lt-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.lt-head b { font-weight: 600; font-size: 15px; }
.livedot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
.legend { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--muted); }
.legend i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; margin-right: -6px; }
.legend i.back { background: none; border-top: 2px dashed var(--done); height: 0; }
.lt-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.clusters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.cluster { text-align: left; padding: 8px 10px 10px; border-radius: 16px; background: var(--surface-2); transition: background 0.15s; }
.cluster:hover { background: var(--surface-3); }
.topo { width: 100%; height: auto; display: block; }
.edge { fill: none; stroke: var(--c); stroke-width: 2; }
.edge.queued { stroke-dasharray: 2 6; opacity: 0.45; }
.edge.back { stroke-dasharray: 6 5; opacity: 0.9; }
.edge.run { stroke-dasharray: 8 8; }
.tnode circle { stroke-width: 2; }
.tnode.queued { opacity: 0.55; }
.ring { fill: none; stroke-width: 1.5; opacity: 0.5; }
.tmodel { font: 600 10px var(--sans); text-transform: capitalize; }
.tmain { font: 600 12px var(--sans); fill: var(--text); }
.tlabel { font: 500 10.5px var(--sans); fill: var(--text); }
.tsub { font: 400 9.5px var(--sans); fill: var(--muted); }
.eventlog { list-style: none; margin: 0; padding: 4px 0 0; max-height: 260px; overflow: hidden; }
.eventlog li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; font-size: 11.5px; padding: 6px 0; border-top: 1px solid var(--outline); }
.eventlog li:first-child { border-top: 0; }
.eventlog li.fresh span:last-child { color: var(--accent); }
.bigtopo-wrap { padding: 14px 16px; }
#bigtopo .topo { max-width: 760px; margin: 0 auto; }
@media (prefers-reduced-motion: no-preference) {
  .edge.run { animation: flow 0.9s linear infinite; }

/** One cluster: the main chat in the middle, each split around it, lines that flow out while running and back when merged. */
function topologySVG(chatId, big) {
  const c = CHATS.find((x) => x.id === chatId), p = P(c.project), kids = SPLITS[chatId] ?? [];
  const W = big ? 760 : 380, H = big ? 360 : 230, cx = W / 2, cy = H / 2, R = big ? 150 : 92;
  const n = kids.length;
  const pos = kids.map((_, i) => { const a = -Math.PI / 2 + (Math.PI * 2 * (i + 0.5)) / n; return [cx + Math.cos(a) * R * (big ? 1.9 : 1.3), cy + Math.sin(a) * R * (big ? 0.85 : 0.8)]; });
  const nodeR = big ? 30 : 20, mainR = big ? 40 : 27;
  const edges = kids.map((k, i) => {
    const [x, y] = pos[i], col = MODEL_C[k.model];
    const cls = k.status === 'running' ? 'edge run' : k.status === 'returned' ? 'edge back' : 'edge queued';
    const d = `M${cx},${cy} Q${(cx + x) / 2},${(cy + y) / 2 - (big ? 30 : 16)} ${x},${y}`;
    return `<path d="${d}" class="${cls}" style="--c:${k.status === 'returned' ? 'var(--done)' : col}"/>`;
  }).join('');
  const nodes = kids.map((k, i) => {
    const [x, y] = pos[i], col = MODEL_C[k.model];
    // Keep each label inside the drawing, even for nodes at the edges.
    const lim = big ? 120 : 62, lx = Math.min(Math.max(x, lim), W - lim), ly = y + nodeR + (big ? 18 : 13);
    return `<g class="tnode ${k.status}">
      <circle cx="${x}" cy="${y}" r="${nodeR}" style="fill:color-mix(in srgb, ${col} 16%, #0e1626);stroke:${k.status === 'returned' ? 'var(--done)' : col}"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" class="tmodel" style="fill:${col}">${k.model}</text>
      ${k.status === 'running' ? `<circle cx="${x}" cy="${y}" r="${nodeR + 6}" class="ring" style="stroke:${col}"/>` : ''}
      <text x="${lx}" y="${ly}" text-anchor="middle" class="tlabel">${esc(k.label.length > (big ? 30 : 18) ? k.label.slice(0, big ? 29 : 17) + '…' : k.label)}</text>
      ${big ? `<text x="${lx}" y="${ly + 15}" text-anchor="middle" class="tsub">${esc(k.kind)} · ${k.status === 'returned' ? 'merged ↩' : k.status}</text>` : ''}
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="topo" role="img" aria-label="${esc(c.name)} split into ${n} tasks">
    <title>${esc(c.name)}: ${kids.filter((k) => k.status === 'running').length} running, ${kids.filter((k) => k.status === 'returned').length} merged, ${kids.filter((k) => k.status === 'queued').length} queued</title>
    ${edges}
    <circle cx="${cx}" cy="${cy}" r="${mainR + 10}" style="fill:${p.hue};opacity:0.08"/>
    <circle cx="${cx}" cy="${cy}" r="${mainR}" style="fill:color-mix(in srgb, ${p.hue} 22%, #0e1626);stroke:${p.hue};stroke-width:2"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="tmain">${esc(c.model.split(' ')[0])}</text>
    <text x="${cx}" y="${cy + 12}" text-anchor="middle" class="tsub" style="fill:${p.hue}">main chat</text>
    ${nodes}
  </svg>`;
}
function topoSummary(chatId) {
  const kids = SPLITS[chatId] ?? [];
  const r = kids.filter((k) => k.status === 'running').length, m = kids.filter((k) => k.status === 'returned').length, q = kids.filter((k) => k.status === 'queued').length;
  return `${kids.length} split${kids.length === 1 ? '' : 's'} · <span style="color:var(--work)">${r} running</span> · <span style="color:var(--done)">${m} merged</span>${q ? ` · ${q} queued` : ''}`;
}
function renderLiveTopology() {

// Simulated feed for the mock: a split starts, runs, and merges back every few seconds.
setInterval(() => {
  const all = Object.entries(SPLITS).flatMap(([cid, ks]) => ks.map((k) => ({ cid, k })));
  const running = all.filter((x) => x.k.status === 'running'), queued = all.filter((x) => x.k.status === 'queued');
  let event;
  if (queued.length && (Math.random() < 0.5 || !running.length)) {
    const x = queued[Math.floor(Math.random() * queued.length)]; x.k.status = 'running';
    event = [nowClock(), x.cid, `${CHATS.find((c) => c.id === x.cid).name} handed “${x.k.label}” to ${x.k.model[0].toUpperCase() + x.k.model.slice(1)} (${x.k.kind.toLowerCase()})`];
  } else if (running.length) {
    const x = running[Math.floor(Math.random() * running.length)]; x.k.status = 'returned';
    event = [nowClock(), x.cid, `“${x.k.label}” came back from ${x.k.model[0].toUpperCase() + x.k.model.slice(1)} and merged into ${CHATS.find((c) => c.id === x.cid).name}`];
  } else {
    all.forEach((x, i) => { x.k.status = i % 3 === 0 ? 'running' : 'queued'; });
    event = [nowClock(), 'c1', 'New plan: work split again across Sonnet and Haiku'];
  }
  TOPO_LOG.unshift(event); TOPO_LOG.length = Math.min(TOPO_LOG.length, 30);
  // Redraw only the live parts, so nothing else on the page jumps.
  const cl = document.getElementById('clusters');
  if (cl) cl.innerHTML = Object.keys(SPLITS).filter((id) => inScope(CHATS.find((x) => x.id === id))).map((id) => { const c = CHATS.find((x) => x.id === id); return `<button type="button" class="cluster" data-chat="${id}">${topologySVG(id, false)}<div class="small" style="font-weight:500">${esc(c.name)}</div><div class="tiny muted">${esc(c.project)} · ${topoSummary(id)}</div></button>`; }).join('');
  const lg = document.getElementById('eventlog');

  const big = document.getElementById('bigtopo');
  if (big) { big.innerHTML = topologySVG(big.dataset.chat, true); const s = document.getElementById('bigsum'); if (s) s.innerHTML = topoSummary(big.dataset.chat); }
}, 3500);

const inScope = (c) => !scope || c.project === scope;
const statePill = (s) => s === 'working' ? '<span class="pill p-work pulse">working</span>' : s === 'waiting' ? '<span class="pill p-wait">waiting for you</span>' : '<span class="pill p-idle">idle</span>';

function stageTrack(p) {
  return `<div><div class="track">${STAGES.map((_, i) => `<span style="background:${i + 1 < p.stage ? p.hue + '88' : i + 1 === p.stage ? p.hue : ''};${i + 1 === p.stage ? `box-shadow:0 0 8px ${p.hue}` : ''}"></span>`).join('')}</div>
    <div class="small" style="margin-top:4px"><span style="color:${p.hue}">0${p.stage} ${STAGES[p.stage - 1]}</span> <span class="dim">· estimated</span></div></div>`;
}
function readinessCell(p) {
  const c = LADDER_C[p.readiness];
  return `<div><div class="track">${LADDER.map((_, i) => `<span style="background:${i <= p.readiness ? c + (i === p.readiness ? '' : '77') : ''}"></span>`).join('')}</div>
    <div class="small" style="margin-top:4px"><span style="color:${c}">${LADDER[p.readiness]}</span> <span class="dim">· ${p.verdict ? 'your verdict' : 'from stage'}</span></div>
    ${p.verdict ? `<div class="tiny muted">“${esc(p.verdict)}”</div>` : ''}</div>`;
}
function progress(done, total, hue) {
  if (!total) return '<span class="tiny dim">no plan or to-do list</span>';
  return `<div class="bar"><i style="width:${Math.round(done / total * 100)}%;background:${hue}"></i></div>`;
}

function chatRow(c) {
  const p = P(c.project);
  const steps = c.total ? `${c.done} of ${c.total} steps` : 'no plan';
  return `<div class="chat" tabindex="0" data-chat="${c.id}">
    <span class="dot" style="background:${c.state === 'idle' ? '#3b4250' : c.state === 'waiting' ? 'var(--gold)' : p.hue}"></span>
    <div style="min-width:0"><div class="cname">${esc(c.name)}</div><div class="tiny dim">${c.model} · ctx ${c.ctx}% · ${c.since === 'now' ? 'active now' : c.since + ' ago'}</div></div>
    <div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">${statePill(c.state)}<span class="tiny muted">${steps}</span></div>${progress(c.done, c.total, p.hue)}</div>
    <div style="min-width:0">${c.asked ? `<div class="said ask">Asked you: “${esc(c.asked)}”</div>` : `<div class="said">${c.doing ? `<span style="color:var(--cyan);font-style:normal">${esc(c.doing)}</span> · ` : ''}Last said: “${esc(c.said)}”</div>`}</div>
    <div class="right tiny muted">${c.files} files · ${c.commits} commits<br>${c.handoffs ? c.handoffs + ' hand-offs · ' : ''}$${c.cost.toFixed(2)}</div>

}

function renderProjects() {
  const list = PROJECTS.filter((p) => !scope || p.name === scope);

    return `<section class="glass project ${open ? 'open' : ''}" style="--hue:${p.hue}">

          <div class="tiny dim">${p.kind} · ${chats.length} chat${chats.length === 1 ? '' : 's'}${waiting ? ` · <span style="color:var(--gold)">${waiting} waiting for you</span>` : ''}${p.roadmap ? ` · roadmap ${p.roadmap[0]}/${p.roadmap[1]}` : ''}</div></div></div>

    <tr><td style="color:#fff">${esc(p.name.toLowerCase().replace(/\s+/g, '-'))}-web</td><td>07</td><td class="muted">v2/frontend</td><td class="muted">clean</td><td>88 (12)</td><td class="muted">4d · Basic edition visuals</td></tr></tbody></table></div>`;

  return `<button type="button" class="back" data-back>← all projects</button>

}

function renderSoul() {
  return `<div class="head"><h1>${scope ? 'Soul of ' + esc(scope) : 'Main soul'}</h1><span class="s">${scope ? 'answers only for ' + esc(scope) : 'answers across every project'}</span></div>

function render() {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'));
  const main = document.getElementById('main');
  main.innerHTML = openChat ? renderChat() : projectPage ? renderProjectPage() : view === 'chats' ? renderChats() : view === 'tasks' ? renderTasks() : view === 'inventory' ? renderInventory() : view === 'soul' ? renderSoul() : renderProjects();
  const p = scope ? P(scope) : null;
  document.getElementById('swName').textContent = scope ?? 'All projects';
  document.getElementById('swDot').style.background = p ? p.hue : '#34d399';
  const waiting = CHATS.filter((c) => inScope(c) && c.state === 'waiting').length;
  document.getElementById('waitBadge').textContent = waiting ? `${waiting} waiting` : '';
  document.getElementById('waitBadge').hidden = !waiting;
  document.getElementById('liveCount').textContent = `${CHATS.filter((c) => inScope(c) && c.state === 'working').length} / ${CHATS.filter(inScope).length}`;
  if (view === 'soul' && !openChat && !projectPage) startSoul(document.getElementById('soul'), p ? p.hue : '#34d399');
}

document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  view = b.dataset.view; openChat = null; projectPage = null; render();
});
document.getElementById('main').addEventListener('click', (e) => {
  const tr = e.target.closest('[data-trigger]');
  if (tr) { e.stopPropagation(); openSend(tr.dataset.trigger); return; }
  const pg = e.target.closest('[data-page]');
  if (pg) { e.preventDefault(); projectPage = pg.dataset.page; projectTab = 'Chats'; render(); return; }
  const chat = e.target.closest('[data-chat]');
  if (chat) { openChat = chat.dataset.chat; render(); window.scrollTo(0, 0); return; }
  const tog = e.target.closest('[data-toggle]');
  if (tog) { const n = tog.dataset.toggle; openSet.has(n) ? openSet.delete(n) : openSet.add(n); render(); return; }
  if (e.target.closest('[data-back]')) { if (openChat) openChat = null; else projectPage = null; render(); return; }
  const pt = e.target.closest('[data-ptab]'); if (pt) { projectTab = pt.dataset.ptab; render(); return; }
  const ct = e.target.closest('[data-copytext]');
  if (ct) { const t = ct.dataset.copytext; const done = () => { const o = ct.textContent; ct.textContent = 'Copied'; setTimeout(() => { ct.textContent = o; }, 1400); }; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(done, done); return; }
  const ic = e.target.closest('[data-invcat]'); if (ic) { invCat = ic.dataset.invcat; render(); return; }
  const ig = e.target.closest('[data-invgroup]'); if (ig) { invGroup = ig.dataset.invgroup; render(); return; }
  const ts = e.target.closest('[data-tasksrc]'); if (ts) { taskSrc = ts.dataset.tasksrc; render(); return; }
  const tm = e.target.closest('[data-taskmode]'); if (tm) { taskMode = tm.dataset.taskmode; render(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { const t = 'Use the delegate tool (model haiku) to write the docs for this change, then check the result.'; navigator.clipboard?.writeText(t).catch(() => {}); cp.textContent = 'Copied'; }
});
document.getElementById('main').addEventListener('input', (e) => { if (e.target.id === 'invq') { invQ = e.target.value; const l = document.getElementById('invList'); if (l) l.innerHTML = invList(); } });
document.getElementById('main').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex]')) { e.preventDefault(); e.target.click(); } });

const swBtn = document.getElementById('swBtn'), swMenu = document.getElementById('swMenu');

// ---- The soul: a breathing shape, drawn the same way for the Soul place and the lock screen ----
const soulLoops = new Map();
function startSoul(canvas, hue) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height, R = W * 0.22;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = Math.random() * 100;
  const draw = () => {
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H / 2);
    for (let r = 0; r < 3; r++) { ctx.beginPath(); ctx.setLineDash([6, 12]); ctx.strokeStyle = hue + '33'; ctx.lineWidth = 2; ctx.arc(0, 0, R * (1.45 + r * 0.32), t * 0.05 * (r % 2 ? 1 : -1), Math.PI * 2 + t * 0.05); ctx.stroke(); }
    ctx.setLineDash([]);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.2); g.addColorStop(0, '#ffffffcc'); g.addColorStop(0.25, hue + 'aa'); g.addColorStop(1, hue + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.05) {
      const k = R * (1 + 0.12 * Math.sin(3 * a + t * 0.9) + 0.07 * Math.sin(5 * a - t * 1.3) + 0.04 * Math.sin(7 * a + t * 0.5));
      a === 0 ? ctx.moveTo(Math.cos(a) * k, Math.sin(a) * k) : ctx.lineTo(Math.cos(a) * k, Math.sin(a) * k);
    }
    ctx.closePath(); ctx.strokeStyle = hue; ctx.lineWidth = 4; ctx.shadowColor = hue; ctx.shadowBlur = 18; ctx.stroke();
    ctx.restore();
    t += reduce ? 0 : 0.016;
    soulLoops.set(canvas, requestAnimationFrame(draw));
  };
  cancelAnimationFrame(soulLoops.get(canvas)); draw();
}

// ---- Lock: only the soul, murmuring without names ----
const lock = document.getElementById('lock'), murmur = document.getElementById('murmur');
const LINES = () => { const w = CHATS.filter((c) => c.state === 'working').length, q = CHATS.filter((c) => c.state === 'waiting').length;
  return [`${['', 'one', 'two', 'three', 'four'][w] || w} chats still thinking…`, `${['', 'one', 'two', 'three'][q] || q} chats waiting for you`, 'tools turning over in the dark', 'one light has gone quiet', 'twenty things wait on a decision', 'holding the threads together', 'humming to itself']; };
let murmurTimer;
function murmurLoop() {
  const lines = LINES(); const line = lines[Math.floor(Math.random() * lines.length)];
  murmur.style.opacity = 1; murmur.style.left = (36 + Math.random() * 28) + '%'; let i = 0;
  const type = () => { if (lock.hidden) return; murmur.textContent = line.slice(0, ++i); murmurTimer = setTimeout(i < line.length ? type : () => { murmur.style.opacity = 0; murmurTimer = setTimeout(murmurLoop, 1500); }, i < line.length ? 70 : 3600); };
  type();
}
function openLock() { lock.hidden = false; startSoul(document.getElementById('lockSoul'), '#34d399'); clearTimeout(murmurTimer); murmurLoop(); }
function closeLock() { lock.hidden = true; clearTimeout(murmurTimer); murmur.textContent = ''; }
document.getElementById('lockBtn').addEventListener('click', openLock);
lock.addEventListener('click', closeLock);
document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') { e.preventDefault(); openLock(); } else if (!lock.hidden && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) closeLock(); });

document.getElementById('sendCancel').addEventListener('click', closeSend);
document.getElementById('sendBox').addEventListener('click', (e) => { if (e.target.id === 'sendBox') closeSend(); });
document.getElementById('sendGo').addEventListener('click', () => {
  const c = CHATS.find((x) => x.id === sendTo);
  closeSend();
  toast(`Sent to “${c.name}”. It will show you the roadmap draft before writing it.`);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('sendBox').hidden) closeSend(); });
buildMenu();
render();
</script>
